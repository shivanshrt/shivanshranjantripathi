<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin CMS | Shivansh Ranjan Tripathi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-6 shadow-2xl">
      <div class="text-center space-y-2">
        <h1 class="text-2xl font-bold text-white">Admin CMS Login</h1>
        <p class="text-slate-400 text-sm">Authorized Access Only</p>
      </div>
      <div id="login-error" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-lg text-sm"></div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase">Email Address</label>
          <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="admin@example.com">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase">Password</label>
          <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition-colors">Sign In to CMS</button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
    <header class="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between">
      <h1 class="font-bold text-lg text-white">Shivansh CMS Dashboard</h1>
      <button id="logout-btn" class="text-sm text-red-400 hover:text-red-300">Sign Out</button>
    </header>
    <main class="p-8 max-w-4xl mx-auto w-full space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
        <h2 class="text-lg font-semibold text-white">Welcome, Admin</h2>
        <p class="text-slate-400 text-sm">Your secure Firebase Authentication session is active. You can manage your profile, projects, and site settings directly through the Firebase Console or custom CMS collections.</p>
        <a href="index.html" target="_blank" class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium">View Live Site ↗</a>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBHHa2a_PVqmoAx2cPtf8LEyZlYC6zxCg",
      authDomain: "shivansh-ranjan-tripathi.firebaseapp.com",
      projectId: "shivansh-ranjan-tripathi",
      storageBucket: "shivansh-ranjan-tripathi.firebasestorage.app",
      messagingSenderId: "1075755218187",
      appId: "1:1075755218187:web:d02b3e8f68640296a65e0e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('login-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const adminDoc = await getDoc(doc(db, "admins", user.uid));
        if (adminDoc.exists()) {
          loginScreen.classList.add('hidden');
          dashboardScreen.classList.remove('hidden');
        } else {
          await signOut(auth);
          showError("Account is not authorized as admin.");
        }
      } else {
        dashboardScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const adminDoc = await getDoc(doc(db, "admins", cred.user.uid));
        if (!adminDoc.exists()) {
          await signOut(auth);
          throw new Error("Unauthorized admin user.");
        }
      } catch (err) {
        showError(err.message);
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    function showError(msg) {
      loginError.innerText = msg;
      loginError.classList.remove('hidden');
    }
  </script>
</body>
</html>
